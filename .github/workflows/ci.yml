name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project ExpenseTracker.xcodeproj -scheme ExpenseTracker \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
