name: ExpenseTracker
options:
  bundleIdPrefix: com.zaidmubbasher
  deploymentTarget:
    iOS: "16.0"
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources: [ExpenseTracker]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 5.9
